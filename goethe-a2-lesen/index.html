<title>A2 Lesen Training</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one screen, no page scroll. One-line top bar; reading pane left + questions right (desktop); reading on top + one question at a time below (phone). White, single theme by request. */
:root {
  --bg: #ffffff;
  --ink: #16191d;
  --muted: #6b7280;
  --line: #e7e9ec;
  --soft: #f3f4f6;
  --accent: #2457c5;
  --accent-soft: #eaf0fc;
  --mark: #fff1a8;
  --good: #178a4c;
  --good-soft: #e7f5ed;
  --bad: #c2352b;
  --bad-soft: #fcecea;
  --f-text: "Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; background: var(--bg); }
body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; max-width: 1200px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { flex: none; display: flex; align-items: center; gap: 12px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.top select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 8px; font-weight: 600; max-width: 52vw; }
.tabs { display: flex; gap: 2px; }
.tab { border: 0; background: none; padding: 5px 9px; border-radius: 6px; color: var(--muted); font-weight: 500; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--soft); color: var(--ink); }
.tab .tl { display: inline; }
.score { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.score b { color: var(--ink); font-weight: 600; }

/* body */
.body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.pane { min-height: 0; overflow: auto; padding-block: 14px; }
.read { padding-right: 24px; border-right: 1px solid var(--line); }
.qs { padding-left: 24px; display: flex; flex-direction: column; overflow: hidden; padding-block: 0; }

.instr { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; }

/* reading material */
.text { font-family: var(--f-text); font-size: 15.5px; line-height: 1.55; }
.text p { margin: 0 0 .7em; max-width: 68ch; }
.src { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 2px; }
.headline { font-family: var(--f-text); font-size: 19px; line-height: 1.25; font-weight: 700; margin: 0 0 8px; text-wrap: balance; }
.mail { font-size: 13px; color: var(--muted); display: grid; grid-template-columns: auto minmax(0,1fr); gap: 0 10px; margin-bottom: 10px; }
.mail dd { margin: 0; color: var(--ink); overflow-wrap: anywhere; }

.board-name { font-family: var(--f-text); font-weight: 700; font-size: 17px; margin: 0 0 6px; }
.floor { display: grid; grid-template-columns: 104px minmax(0,1fr); gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-family: var(--f-text); font-size: 15px; }
.floor:first-of-type { border-top: 0; }
.floor .fl { font-family: var(--f-ui); font-size: 13px; font-weight: 600; color: var(--accent); padding-top: 1px; }

.ads { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 24px; }
.ad { padding: 8px 0; border-top: 1px solid var(--line); font-family: var(--f-text); font-size: 14.5px; line-height: 1.45; }
.ad b { font-family: var(--f-ui); color: var(--accent); margin-right: 6px; }
.ad strong { font-weight: 700; }

/* questions */
.qhead { flex: none; display: flex; align-items: center; gap: 8px; padding-block: 12px 10px; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nv { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); padding: 0; font-variant-numeric: tabular-nums; }
.nv.done { background: var(--soft); color: var(--ink); }
.nv.cur { border-color: var(--ink); color: var(--ink); }
.nv.ok { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.nv.no { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.check { margin-left: auto; border: 0; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 6px 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.check.again { background: var(--soft); color: var(--ink); }
.list { flex: 1; min-height: 0; overflow: auto; padding-bottom: 14px; display: flex; flex-direction: column; gap: 14px; }

.item { display: grid; gap: 5px; }
.q { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 4px; font-family: var(--f-text); font-size: 15px; font-weight: 700; line-height: 1.35; }
.q .n { font-family: var(--f-ui); font-size: 12px; color: var(--accent); padding-top: 2px; font-weight: 600; }
.opts { display: grid; gap: 2px; padding-left: 26px; }
.opt { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 8px; align-items: start; font-family: var(--f-text); font-size: 14.5px; padding: 3px 4px 3px 0; border-radius: 5px; }
.opt .ot { padding-top: 1px; }
.box { width: 24px; height: 24px; border: 1.5px solid #9aa1ab; border-radius: 4px; background: var(--bg); cursor: pointer; display: grid; place-items: center; font-size: 12px; color: var(--muted); position: relative; padding: 0; }
.box:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.box:disabled { cursor: default; }
.box[aria-checked="true"] { border-color: var(--accent); color: transparent; }
.box[aria-checked="true"]::before, .box[aria-checked="true"]::after { content: ""; position: absolute; width: 17px; height: 2px; background: var(--accent); border-radius: 2px; }
.box[aria-checked="true"]::before { transform: rotate(45deg); }
.box[aria-checked="true"]::after { transform: rotate(-45deg); }
.opt.right { background: var(--good-soft); }
.opt.right .box { border-color: var(--good); }
.opt.right .box::before, .opt.right .box::after { background: var(--good); }
.opt.wrong { background: var(--bad-soft); }
.opt.wrong .box { border-color: var(--bad); }
.opt.wrong .box::before, .opt.wrong .box::after { background: var(--bad); }
.boxes { display: flex; flex-wrap: wrap; gap: 5px; padding-left: 26px; }
.boxes .box { width: 30px; height: 30px; color: var(--ink); font-size: 13px; }
.boxes .box[aria-checked="true"] { color: transparent; }
.boxes .box.right { border-color: var(--good); background: var(--good-soft); }
.boxes .box.right::before, .boxes .box.right::after { background: var(--good); }
.boxes .box.wrong { border-color: var(--bad); background: var(--bad-soft); }
.boxes .box.wrong::before, .boxes .box.wrong::after { background: var(--bad); }
.sol { padding-left: 26px; font-size: 12px; color: var(--bad); }

/* tappable words */
.w { cursor: pointer; border-radius: 2px; -webkit-tap-highlight-color: transparent; }
.w:hover { background: var(--accent-soft); }
.w.on { background: var(--mark); }

/* word popover */
.pop { position: fixed; z-index: 20; width: min(300px, calc(100vw - 32px)); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgba(20,25,35,.14); padding: 10px 12px; display: grid; gap: 4px; }
.pop .lemma { font-family: var(--f-text); font-size: 16px; font-weight: 700; padding-right: 22px; line-height: 1.3; }
.pop .row { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 6px; font-size: 14px; }
.pop .lg { font-size: 10.5px; color: var(--muted); text-transform: uppercase; padding-top: 2px; }
.pop .def { font-family: var(--f-text); font-style: italic; font-size: 13.5px; color: var(--muted); margin-top: 2px; }
.pop .tag { font-size: 10.5px; color: var(--accent); font-weight: 600; }
.pop .x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border: 0; background: none; color: var(--muted); font-size: 17px; cursor: pointer; border-radius: 5px; }

/* phone: reading on top, one question at a time below */
@media (max-width: 760px) {
  .top { gap: 8px; }
  .tab .tl { display: none; }
  .score { display: none; }
  .body { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) auto; }
  .read { padding-right: 0; border-right: 0; padding-block: 10px; }
  .qs { padding-left: 0; border-top: 1px solid var(--line); max-height: 55vh; overflow: auto; display: block; }
  .qhead { padding-block: 8px 6px; }
  .list { overflow: visible; padding-bottom: 10px; }
  .item:not(.cur) { display: none; }
  .ads { grid-template-columns: minmax(0,1fr); }
  .floor { grid-template-columns: 84px minmax(0,1fr); }
  .text { font-size: 15px; }
}
</style>

<div class="app">
  <header class="top" title="">
    <select id="test" aria-label="Modelltest"></select>
    <div class="tabs" id="tabs" role="tablist" aria-label="Teil"></div>
    <div class="score" id="score"></div>
  </header>
  <div class="body">
    <section class="pane read" id="read"></section>
    <section class="pane qs" id="qs"></section>
  </div>
</div>
<div class="pop" id="pop" hidden role="dialog" aria-label="Wortbedeutung"></div>

<script src="exams.js"></script>
<script>
(function () {
  const EXAMS = window.EXAMS || [];
  const WORDS = window.WORDS || {};
  const TEILE = ["teil1", "teil2", "teil3", "teil4"];
  const ABC = ["a", "b", "c"];

  const INDEX = {};
  for (const id in WORDS) {
    INDEX[id.toLowerCase()] = INDEX[id.toLowerCase()] || id;
    (WORDS[id].forms || []).forEach(f => { INDEX[String(f).toLowerCase()] = id; });
  }

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const state = Object.assign({ test: 0, teil: 0, answers: {}, checked: {} }, store.get("a2lesen:v1", {}));
  if (!EXAMS[state.test]) state.test = 0;
  let cur = 0;
  const save = () => store.set("a2lesen:v1", state);

  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const TOKEN = /([A-Za-zÀ-ÖØ-öø-ÿ]+)/g;
  const wz = text => String(text).split(TOKEN).map((p, i) => {
    if (i % 2 === 0) return esc(p);
    const id = INDEX[p.toLowerCase()];
    return id ? `<span class="w" data-k="${esc(id)}">${esc(p)}</span>` : esc(p);
  }).join("");

  const exam = () => EXAMS[state.test];
  const teil = () => exam()[TEILE[state.teil]];
  const key = n => `${exam().id}:${n}`;
  const ckey = i => `${exam().id}:${TEILE[i]}`;
  const score = (ex, k) => ex[k].questions.reduce((s, q) => s + (state.answers[`${ex.id}:${q.n}`] === q.answer ? 1 : 0), 0);

  function renderTop() {
    $("#test").innerHTML = EXAMS.map((ex, i) => `<option value="${i}" ${i === state.test ? "selected" : ""}>${esc(ex.title)}</option>`).join("");
    $("#tabs").innerHTML = TEILE.map((k, i) => `<button class="tab" role="tab" data-teil="${i}" aria-selected="${i === state.teil}"><span class="tl">Teil </span>${i + 1}</button>`).join("");
    const ex = exam();
    let pts = 0, max = 0, done = 0;
    TEILE.forEach((k, i) => { if (state.checked[ckey(i)]) { pts += score(ex, k); max += ex[k].questions.length; done++; } });
    $("#score").innerHTML = done === 4
      ? `<b>${pts}/20</b> · ${(pts * 1.25).toLocaleString("de-DE")}/25 · ${pts >= 12 ? "bestanden" : "nicht bestanden"}`
      : done ? `<b>${pts}/${max}</b> · ${done}/4 Teile` : "20 Aufgaben · 30 Min.";
  }

  function renderRead() {
    const k = TEILE[state.teil], t = teil();
    let h = `<p class="instr">${wz(t.instruction || "")}</p>`;
    if (k === "teil1") {
      h += `<div class="text">${t.source ? `<div class="src">${wz(t.source)}</div>` : ""}<h1 class="headline">${wz(t.headline || "")}</h1>${t.paragraphs.map(p => `<p>${wz(p)}</p>`).join("")}</div>`;
    } else if (k === "teil2") {
      h += `<h1 class="board-name">${wz(t.place || "")}</h1>${t.board.map(f => `<div class="floor"><span class="fl">${wz(f.floor)}</span><span>${f.items.map(wz).join(", ")}</span></div>`).join("")}`;
    } else if (k === "teil3") {
      const m = t.email;
      h += `<dl class="mail"><dt>Von</dt><dd>${wz(m.from)}</dd><dt>An</dt><dd>${wz(m.to)}</dd><dt>Betreff</dt><dd><strong>${wz(m.subject)}</strong></dd></dl><div class="text">${m.paragraphs.map(p => `<p>${wz(p)}</p>`).join("")}</div>`;
    } else {
      h += `<div class="ads">${t.ads.map(a => `<div class="ad"><b>${esc(a.id)}</b><strong>${wz(a.title)}</strong><br>${wz(a.text)}</div>`).join("")}</div>`;
    }
    $("#read").innerHTML = h;
    $("#read").scrollTop = 0;
  }

  function renderQs() {
    const t = teil(), checked = !!state.checked[ckey(state.teil)], isT4 = TEILE[state.teil] === "teil4";
    if (cur >= t.questions.length) cur = 0;
    const nav = t.questions.map((q, i) => {
      const a = state.answers[key(q.n)];
      let c = "nv";
      if (checked) c += a === q.answer ? " ok" : " no"; else if (a !== undefined) c += " done";
      if (i === cur) c += " cur";
      return `<button class="${c}" data-cur="${i}" aria-label="Aufgabe ${q.n}">${q.n}</button>`;
    }).join("");
    const items = t.questions.map((q, i) => {
      const a = state.answers[key(q.n)];
      let body;
      if (isT4) {
        body = `<div class="boxes" role="radiogroup">${t.ads.map(x => x.id).concat("x").map(id => {
          let c = "box";
          if (checked) { if (id === q.answer) c += " right"; else if (id === a) c += " wrong"; }
          return `<button class="${c}" role="radio" aria-checked="${a === id}" data-n="${q.n}" data-v="${id}" ${checked ? "disabled" : ""}>${id}</button>`;
        }).join("")}</div>`;
      } else {
        body = `<div class="opts" role="radiogroup">${q.options.map((o, j) => {
          let c = "opt";
          if (checked) { if (j === q.answer) c += " right"; else if (j === a) c += " wrong"; }
          return `<div class="${c}"><button class="box" role="radio" aria-checked="${a === j}" data-n="${q.n}" data-v="${j}" ${checked ? "disabled" : ""}>${ABC[j]}</button><span class="ot">${wz(o)}</span></div>`;
        }).join("")}</div>`;
      }
      const sol = checked && a !== q.answer && isT4 ? `<div class="sol">Richtig: ${q.answer === "x" ? "x – keine Anzeige" : q.answer}</div>` : "";
      return `<div class="item${i === cur ? " cur" : ""}" id="q${q.n}"><div class="q"><span class="n">${q.n}</span><span>${wz(q.q)}</span></div>${body}${sol}</div>`;
    }).join("");
    const btn = checked
      ? `<button class="check again" data-act="reset">${score(exam(), TEILE[state.teil])}/${t.questions.length} · Nochmal</button>`
      : `<button class="check" data-act="check">Prüfen</button>`;
    $("#qs").innerHTML = `<div class="qhead"><div class="nav">${nav}</div>${btn}</div><div class="list">${items}</div>`;
  }

  function render() { renderTop(); renderRead(); renderQs(); save(); }

  // popover
  const pop = $("#pop");
  let on = null;
  function closePop() { pop.hidden = true; if (on) on.classList.remove("on"); on = null; }
  function openPop(el) {
    const w = WORDS[el.dataset.k]; if (!w) return;
    if (on) on.classList.remove("on");
    on = el; el.classList.add("on");
    pop.innerHTML = `<button class="x" aria-label="Schließen">×</button>
      <div class="lemma">${esc(w.de || el.dataset.k)}</div>
      ${w.en ? `<div class="row"><span class="lg">en</span><span>${esc(w.en)}</span></div>` : ""}
      ${w.tr ? `<div class="row"><span class="lg">tr</span><span>${esc(w.tr)}</span></div>` : ""}
      ${w.def ? `<div class="def">${esc(w.def)}</div>` : ""}
      ${w.a2 ? `<div class="tag">Goethe A2 Wortliste</div>` : ""}`;
    pop.hidden = false;
    const r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    const vw = document.documentElement.clientWidth, vh = window.innerHeight;
    const left = Math.max(16, Math.min(r.left + r.width / 2 - pw / 2, vw - pw - 16));
    let top = r.bottom + 6;
    if (top + ph > vh - 8) top = Math.max(8, r.top - ph - 6);
    pop.style.left = left + "px"; pop.style.top = top + "px";
  }

  document.addEventListener("click", e => {
    const w = e.target.closest(".w");
    if (w) { if (w === on) closePop(); else openPop(w); return; }
    if (e.target.closest(".x")) { closePop(); return; }
    if (e.target.closest("#pop")) return;
    closePop();
    const tb = e.target.closest("[data-teil]");
    if (tb) { state.teil = +tb.dataset.teil; cur = 0; render(); return; }
    const nv = e.target.closest("[data-cur]");
    if (nv) { cur = +nv.dataset.cur; renderQs(); const el = $(`#q${teil().questions[cur].n}`); if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" }); return; }
    const box = e.target.closest(".box[data-n]");
    if (box && !box.disabled) {
      const v = isNaN(+box.dataset.v) ? box.dataset.v : +box.dataset.v;
      const k = key(box.dataset.n);
      if (state.answers[k] === v) delete state.answers[k]; else state.answers[k] = v;
      cur = teil().questions.findIndex(q => String(q.n) === box.dataset.n);
      renderQs(); save(); return;
    }
    const act = e.target.closest("[data-act]");
    if (act) {
      if (act.dataset.act === "check") state.checked[ckey(state.teil)] = true;
      else { delete state.checked[ckey(state.teil)]; teil().questions.forEach(q => delete state.answers[key(q.n)]); }
      cur = 0; renderTop(); renderQs(); save();
    }
  });
  $("#test").addEventListener("change", e => { state.test = +e.target.value; state.teil = 0; cur = 0; render(); });
  document.addEventListener("scroll", closePop, true);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closePop(); });
  window.addEventListener("resize", closePop);

  if (EXAMS.length) render(); else $("#read").textContent = "Keine Tests gefunden.";
})();
</script>
